name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Force uv to use the matrix interpreter for sync AND every `uv run`.
      # Without this, uv may prefer a system Python that satisfies
      # requires-python (macos-latest shipped Homebrew 3.14, which is how an
      # unpinned 3.14 broke the matrix'd "3.12"/"3.13" jobs).
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check src tests examples

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests examples

      - name: Test
        run: uv run pytest -q
