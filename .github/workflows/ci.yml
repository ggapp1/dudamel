name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Force uv to use the matrix interpreter for sync AND every `uv run`.
      # Without this, uv may prefer a system Python that satisfies
      # requires-python (macos-latest shipped Homebrew 3.14, which is how an
      # unpinned 3.14 broke the matrix'd "3.12"/"3.13" jobs).
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv stopped publishing floating major tags at
        # v8, so `@v9` does not resolve and must never be used here.
        # Caching stays off: setup-uv enables it by default from v5 on, but
        # the matrix jobs share one cache key and race to reserve it, which
        # fails the save and annotates the run. This workflow never cached
        # before and does not need to.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Lockfile is up to date
        # release.yml installs with `uv sync --locked`, so an out-of-date
        # lockfile must fail here, in CI, rather than mid-release once a
        # tag has already been pushed.
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check src tests examples

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests examples

      - name: Test
        run: uv run pytest -q
