name: Release

# Publishes to PyPI when a v* tag is pushed. Authentication is PyPI's trusted
# publishing (OIDC): the `id-token: write` permission below lets this workflow
# mint a short-lived token at run time, so no API token is stored in repository
# secrets or on anyone's machine.
#
# A PyPI upload is final — a version number can never be reused, even after the
# release is deleted. Everything that can fail cheaply (tag/version agreement,
# lint, tests, build) therefore runs before the publish step.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      # Pin the interpreter for sync AND every `uv run`. Left unset, uv may
      # prefer whatever system Python satisfies requires-python, which is not
      # necessarily the one this release was tested against.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv stopped publishing floating major tags at
        # v8, so `@v9` does not resolve and must never be used here.
        uses: astral-sh/setup-uv@v9.0.0

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check src tests examples

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests examples

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # `always` rather than the default `automatic`: fail loudly if the OIDC
        # exchange is unavailable instead of silently falling back to looking
        # for a token that does not exist.
        run: uv publish --trusted-publishing always
