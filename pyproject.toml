[project]
name = "dudamel"
version = "0.1.0"
description = "A framework for personal AI assistants on your own hardware"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "personal assistant",
    "llm",
    "agent",
    "telegram",
    "dashboard",
    "mcp",
    "home server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Floors below are the oldest release the test suite actually passes on,
    # measured by installing each floor into a bare venv -- not guesses. The
    # lockfile always resolves far above them, so only a fresh constrained
    # install ever sees them.
    "pydantic>=2.12",
    # 2.2 leaves a nested env override (DUDAMEL_APPS__WEATHER__LATITUDE) as a
    # string instead of coercing it to the declared type.
    "pydantic-settings>=2.3",
    # 2.0.30 fails to import on Python 3.13+ ("Can't replace canonical symbol
    # for '__firstlineno__'"), and this package supports 3.12-3.14.
    "sqlalchemy[asyncio]>=2.0.31",
    "aiosqlite>=0.20",
    # 1.16 added the path_separator config option that migrate.py's suite lanes
    # rely on; below it the option is ignored and a lane whose versions path
    # contains a space, comma or colon fails to resolve.
    "alembic>=1.16",
    # 3.10.0-3.10.1 import pkg_resources, absent from a bare 3.12+ venv; 3.10.2
    # dropped that import and passes the suite, so the floor sits there.
    "apscheduler>=3.10.2,<4",
    "httpx>=0.27",
    "fastapi>=0.140.0",
    "uvicorn>=0.51,<0.53",
    "jinja2>=3.1.6",
    # 21.0-21.3 make Application non-weak-referenceable, which the bot wrapper
    # relies on; 21.4 restores it.
    "python-telegram-bot>=21.4,<22",
    # mcp 2.x only: 2.0 renamed the client request context and moved five
    # model attributes from camelCase to snake_case, so 1.x and 2.x cannot be
    # supported by the same source without a shim. A dual-support claim is
    # only honest with a CI lane resolving each major fresh, which is
    # disproportionate for an experimental feature in a pre-1.0 framework.
    # The major is lockstep: mcp 2.x pins mcp-types==2.0.0 exactly.
    # Note mcp 2.x brings a second HTTP stack (httpx2) alongside our httpx.
    "mcp>=2,<3",
    "python-dotenv>=1.2.2",
    # Reached directly for the host zone, so it is declared rather than left
    # transitive through apscheduler -- apscheduler 4 drops it, and an
    # undeclared import is how a dependency bump breaks a release. The floor
    # is load-bearing: apscheduler's own floor permits tzlocal 2.x, whose
    # get_localzone() returns a pytz object rather than a ZoneInfo.
    "tzlocal>=5",
]

[project.scripts]
dudamel = "dudamel.cli:main"

[project.urls]
Homepage = "https://github.com/ggapp1/dudamel"
Repository = "https://github.com/ggapp1/dudamel"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ships the whole tree incl. migrations/, migrations_app_template/ and migrations_suite_lane/ — do NOT add force-include (duplicate-path build error)
packages = ["src/dudamel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: shells out to real subprocesses (uv build/run) -- several seconds, always runs in CI but selectable via -m 'not slow' for a fast local loop",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI relies on `Depends(...)` as an argument default — the standard
# idiom, not a bug; the immutable-calls allowlist opts it (and Query, the
# same idiom's sibling for declaring query-parameter defaults) out of B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
