[project]
name = "dudamel"
version = "0.1.0"
description = "A framework for personal AI assistants on your own hardware"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "personal assistant",
    "llm",
    "agent",
    "telegram",
    "dashboard",
    "mcp",
    "home server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "fastapi>=0.140.0",
    "uvicorn>=0.51,<0.52",
    "jinja2>=3.1.6",
    "python-telegram-bot>=21,<22",
    "mcp>=1.28.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
dudamel = "dudamel.cli:main"

[project.urls]
Homepage = "https://github.com/ggapp1/dudamel"
Repository = "https://github.com/ggapp1/dudamel"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ships the whole tree incl. migrations/ and migrations_app_template/ — do NOT add force-include (duplicate-path build error)
packages = ["src/dudamel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: shells out to real subprocesses (uv build/run) -- several seconds, always runs in CI but selectable via -m 'not slow' for a fast local loop",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI relies on `Depends(...)` as an argument default — the standard
# idiom, not a bug; the immutable-calls allowlist opts it (and Query, the
# same idiom's sibling used by Task 4) out of B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
