# dudamel project configuration.
#
# Both tiers below point at a local Ollama server (an OpenAI-compatible HTTP
# API) so this project runs fully offline out of the box. Swap `model` for
# whatever you have pulled locally (`ollama pull ...`), or repoint a tier at
# a hosted provider later — see `provider = "anthropic"` in the docs.

[llm.tiers.standard]
provider = "openai-compatible"
base_url = "http://localhost:11434/v1"
model = "qwen3.5:9b"
# If this model rejects requests with `tools` or never emits a tool call,
# uncomment the next line to switch to the prompted-JSON fallback, then
# run `dudamel doctor --probe-tools` to confirm it actually works:
# tool_calling = "prompted"

[llm.tiers.fast]
provider = "openai-compatible"
base_url = "http://localhost:11434/v1"
model = "qwen3.5:1.5b"

# [router]
# Customize the assistant's system-prompt identity line ("You are...").
# Leave commented out for the default identity.
# persona = "a terse, no-nonsense workshop assistant"

[web]
host = "127.0.0.1"
port = 8787
# Uncomment if dudamel runs behind a reverse proxy (nginx, Caddy) on this
# same host, so it trusts that proxy's X-Forwarded-For instead of treating
# every request as coming from the proxy itself:
# trusted_proxies = ["127.0.0.1"]
