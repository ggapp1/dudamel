<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}dudamel{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
    }
    nav {
      display: flex;
      gap: 1.25rem;
      padding: 1rem 0;
      border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      margin-bottom: 1.5rem;
    }
    nav a { color: inherit; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .card {
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 10px;
      padding: 1rem;
    }
    .card.error { border-color: #c0392b; }
    .card h3 {
      margin: 0 0 .5rem;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .7;
    }
    .stat-value { font-size: 1.8rem; font-weight: 700; }
    .stat-delta { font-size: .85rem; opacity: .7; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td {
      text-align: left;
      padding: .35rem .5rem;
      border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
    }
    pre.markdown { white-space: pre-wrap; font-family: inherit; margin: 0; }
    .msg { padding: .5rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
    .msg .role { font-weight: 700; text-transform: uppercase; font-size: .7rem; opacity: .6; margin-right: .5rem; }
    .pending {
      border: 1px solid #d4a017;
      border-radius: 10px;
      padding: .75rem;
      margin: .75rem 0;
    }
    .chat-input { display: flex; gap: .5rem; margin-top: 1rem; }
    .chat-input input[type=text] { flex: 1; padding: .4rem; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/chat">Chat</a>
    <a href="/activity">Activity</a>
    <a href="/jobs">Jobs</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
